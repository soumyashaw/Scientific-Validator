name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - name: Validate example as a workflow quality gate
        run: scivalid check examples/particle_events/valid --contract examples/particle_events/contract.yaml --report-json build/example-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-report-${{ matrix.python-version }}
          path: build/example-report.json

